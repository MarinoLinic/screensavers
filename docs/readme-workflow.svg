<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" role="img" aria-labelledby="title desc"><title id="title">Screensavers</title><desc id="desc">Workflow diagram. Workflow diagram: one loopback server serves the library and independent project folders.</desc><rect width="920" height="260" rx="16" fill="#f2f5f4"/><g font-family="Segoe UI,Arial,sans-serif"><text x="30" y="48" font-size="24" font-weight="600" fill="#182b34">Screensavers</text><rect x="30" y="88" width="260" height="108" rx="12" fill="#fff" stroke="#d8dfdd"/><text x="50" y="124" font-size="20" font-weight="600" fill="#224d5c">Local library</text><text x="50" y="158" font-size="15" fill="#41535b">Start.bat and shared controls</text><path d="M300 140h18m-7-7 7 7-7 7" fill="none" stroke="#224d5c" stroke-width="2"/><rect x="330" y="88" width="260" height="108" rx="12" fill="#fff" stroke="#d8dfdd"/><text x="350" y="124" font-size="20" font-weight="600" fill="#224d5c">Six projects</text><text x="350" y="158" font-size="15" fill="#41535b">Choose a scene or game</text><path d="M600 140h18m-7-7 7 7-7 7" fill="none" stroke="#224d5c" stroke-width="2"/><rect x="630" y="88" width="260" height="108" rx="12" fill="#fff" stroke="#d8dfdd"/><text x="650" y="124" font-size="20" font-weight="600" fill="#224d5c">Browser rendering</text><text x="650" y="158" font-size="15" fill="#41535b">Offline assets and settings</text><text x="30" y="232" font-size="15" fill="#41535b">Workflow diagram: one loopback server serves the library and independent project folders.</text></g></svg>
